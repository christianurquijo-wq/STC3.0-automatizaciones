# Seguimiento General STC 3.0 · reconstrucción automática de lunes a viernes a las 6, 8 y 10 a. m., 12 m. y 2, 4 y
# 6 p. m. (hora de Colombia).
# Corre el mismo script que el botón del Panel (Seguimiento_general/reconstruir_seguimiento_real.py) con la
# bitácora de ops_logger.py, así cada ejecución queda en LOG_EJECUCIONES y, si falla, llega la alerta por correo.
# Comparte el grupo de concurrencia con ops_run_script.yml: si el Panel y el cron coinciden, uno espera al otro.
name: STC · Seguimiento General (L-V 6 a. m.–6 p. m.)

on:
  schedule:
    # GitHub usa hora UTC (Colombia = UTC-5): 11,13,…,23 UTC = 6 a. m., 8 a. m., …, 6 p. m. en Colombia.
    # Minuto 5 y no 0: en punto GitHub tiene más cola y suele retrasar más los programados.
    - cron: "5 11,13,15,17,19,21,23 * * 1-5"
  workflow_dispatch: {}

concurrency:
  group: ops-Seguimiento_general/reconstruir_seguimiento_real.py
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reconstruir:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "Seguimiento_general/requirements.txt"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r Seguimiento_general/requirements.txt google-auth requests

      - name: Restaurar archivos secretos
        env:
          SECRETS_BUNDLE: ${{ secrets.SECRETS_BUNDLE }}
        run: |
          if [ -z "$SECRETS_BUNDLE" ]; then echo "::error::SECRETS_BUNDLE no configurado"; exit 1; fi
          echo "$SECRETS_BUNDLE" | base64 -d > "$RUNNER_TEMP/s.zip"
          unzip -oq "$RUNNER_TEMP/s.zip" -d .
          rm -f "$RUNNER_TEMP/s.zip"

      - name: Reconstruir con bitácora
        env:
          OPS_ORIGEN: cron
          OPS_ACTOR: github-cron
          OPS_SHEET_ID: ${{ secrets.OPS_SHEET_ID }}
          OPS_LOG_SA_JSON: ${{ secrets.OPS_LOG_SA_JSON }}
          OPS_ALERT_WEBHOOK: ${{ secrets.OPS_ALERT_WEBHOOK }}
          OPS_ALERT_TOKEN: ${{ secrets.OPS_ALERT_TOKEN }}
        run: python ops_logger.py --script "Seguimiento_general/reconstruir_seguimiento_real.py" --cwd script --timeout 30